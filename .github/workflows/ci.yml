name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    env:
      GLANCE_DATA_ROOT: /tmp/GlanceTests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift debug build
        run: swift build

      - name: Swift release build
        run: swift build -c release

      - name: Swift tests
        run: swift test

      - name: Xcode debug build
        run: |
          xcodebuild \
            -project Glance.xcodeproj \
            -scheme Glance \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Xcode tests
        run: |
          xcodebuild \
            -project Glance.xcodeproj \
            -scheme Glance \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package smoke test
        run: |
          ./scripts/package-macos.sh
          test -d dist/Glance.app
          test -x dist/Glance.app/Contents/MacOS/Glance
          test -f dist/Glance.app/Contents/Info.plist
          test -f dist/Glance.app/Contents/Resources/AppIcon.icns
