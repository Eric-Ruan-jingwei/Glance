name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    env:
      GLANCE_DATA_ROOT: /tmp/GlanceCI-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version metadata
        run: ./scripts/verify-version-metadata.sh

      - name: Swift debug build
        run: swift build

      - name: Swift release build
        run: swift build -c release

      - name: Swift tests
        run: swift test

      - name: Xcode debug build
        run: |
          xcodebuild \
            -project Glance.xcodeproj \
            -scheme Glance \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Xcode tests
        run: |
          xcodebuild \
            -project Glance.xcodeproj \
            -scheme Glance \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package smoke test
        run: |
          ./scripts/package-macos.sh
          test -d dist/Glance.app
          test -x dist/Glance.app/Contents/MacOS/Glance
          test -f dist/Glance.app/Contents/Info.plist
          test -f dist/Glance.app/Contents/Resources/AppIcon.icns
          source_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Glance/Info.plist)"
          source_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Glance/Info.plist)"
          app_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Glance.app/Contents/Info.plist)"
          app_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/Glance.app/Contents/Info.plist)"
          if [[ "$app_marketing" != "$source_marketing" || "$app_build" != "$source_build" ]]; then
            echo "Version metadata mismatch:"
            echo "Info.plist marketing version: $source_marketing"
            echo "Built Glance.app marketing version: $app_marketing"
            echo "Info.plist build version: $source_build"
            echo "Built Glance.app build version: $app_build"
            exit 1
          fi
          prohibited="$(/usr/libexec/PlistBuddy -c 'Print :LSMultipleInstancesProhibited' dist/Glance.app/Contents/Info.plist)"
          if [[ "$prohibited" != "true" ]]; then
            echo "LSMultipleInstancesProhibited must be true in packaged Glance.app"
            exit 1
          fi
          archs="$(lipo -archs dist/Glance.app/Contents/MacOS/Glance)"
          echo "Packaged binary architectures: $archs"
          if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
            echo "Packaged Glance binary must be Universal 2 (arm64 x86_64)"
            exit 1
          fi

      - name: Distribution package smoke
        run: |
          ./scripts/build-distribution.sh
          marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Glance/Info.plist)"
          zip="dist/Glance-${marketing}.zip"
          dmg="dist/Glance-${marketing}.dmg"
          test -f "$zip"
          test -f "$dmg"
          test -f dist/SHA256SUMS
          (cd dist && shasum -a 256 -c SHA256SUMS)
          extract="$(mktemp -d)"
          mount="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount" >/dev/null 2>&1 || true
            rm -rf "$extract" "$mount"
          }
          trap cleanup EXIT
          ditto -x -k "$zip" "$extract"
          test -d "$extract/Glance.app"
          test -x "$extract/Glance.app/Contents/MacOS/Glance"
          test -f "$extract/Glance.app/Contents/Info.plist"
          test -f "$extract/Glance.app/Contents/Resources/AppIcon.icns"
          zip_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$extract/Glance.app/Contents/Info.plist")"
          zip_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$extract/Glance.app/Contents/Info.plist")"
          zip_prohibited="$(/usr/libexec/PlistBuddy -c 'Print :LSMultipleInstancesProhibited' "$extract/Glance.app/Contents/Info.plist")"
          zip_archs="$(lipo -archs "$extract/Glance.app/Contents/MacOS/Glance")"
          if [[ "$zip_marketing" != "$marketing" || "$zip_build" != "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Glance/Info.plist)" || "$zip_prohibited" != "true" ]]; then
            echo "ZIP app metadata mismatch"
            exit 1
          fi
          if [[ "$zip_archs" != *arm64* || "$zip_archs" != *x86_64* ]]; then
            echo "ZIP Glance binary must be Universal 2 (arm64 x86_64), got: $zip_archs"
            exit 1
          fi
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          test -d "$mount/Glance.app"
          test -L "$mount/Applications"
          test "$(readlink "$mount/Applications")" = "/Applications"
          dmg_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount/Glance.app/Contents/Info.plist")"
          dmg_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$mount/Glance.app/Contents/Info.plist")"
          dmg_prohibited="$(/usr/libexec/PlistBuddy -c 'Print :LSMultipleInstancesProhibited' "$mount/Glance.app/Contents/Info.plist")"
          dmg_archs="$(lipo -archs "$mount/Glance.app/Contents/MacOS/Glance")"
          hdiutil detach "$mount"
          mount=""
          if [[ "$dmg_marketing" != "$marketing" || "$dmg_build" != "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Glance/Info.plist)" || "$dmg_prohibited" != "true" ]]; then
            echo "DMG app metadata mismatch"
            exit 1
          fi
          if [[ "$dmg_archs" != *arm64* || "$dmg_archs" != *x86_64* ]]; then
            echo "DMG Glance binary must be Universal 2 (arm64 x86_64), got: $dmg_archs"
            exit 1
          fi
          echo "NOTE: This beta artifact is ad-hoc signed and is not notarized."
          echo "Gatekeeper rejection is expected for external distribution."
          spctl --assess --verbose dist/Glance.app || true
